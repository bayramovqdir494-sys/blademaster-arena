:root{color-scheme:dark;--ui:1;--bg:#1b1230;--ol:#26183d;--text:#fff8ec;--mute:#cdc3ea;--panel:#43327c;--panel2:#2a1e50;--deep:#170f33;
  --gold:#ffd23f;--gold2:#f59e1b;--green:#6fe06a;--green2:#2fa84a;--blue:#7fa6ff;--blue2:#4a6ef0;--red:#ff5d6c;--red2:#d6304a;

.ot{text-shadow:-2px 0 var(--ol),2px 0 var(--ol),0 -2px var(--ol),0 2px var(--ol),-1.5px -1.5px var(--ol),1.5px -1.5px var(--ol),-1.5px 1.5px var(--ol),1.5px 1.5px var(--ol),0 3.5px 0 var(--ol)}

.btn{position:relative;font-family:var(--fd);font-size:1.15em;line-height:1;color:#fff;border:3px solid var(--ol);border-radius:.85em;padding:.62em 1.25em;background:linear-gradient(var(--blue),var(--blue2));box-shadow:0 .28em 0 #2b3ea3,0 .28em 0 3px var(--ol),inset 0 2px 0 rgba(255,255,255,.35);cursor:pointer;text-shadow:0 2px 0 rgba(27,18,48,.5);letter-spacing:.02em;transition:transform .06s,filter .12s;display:inline-flex;align-items:center;justify-content:center;gap:.4em;white-space:nowrap}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(.2em);box-shadow:0 .08em 0 #2b3ea3,0 .08em 0 3px var(--ol)}
.btn.gold{background:linear-gradient(#ffe778,#ffab1c);color:#4a2a05;text-shadow:0 1px 0 rgba(255,255,255,.55);box-shadow:0 .28em 0 #c4720a,0 .28em 0 3px var(--ol),inset 0 2px 0 rgba(255,255,255,.6)}
.btn.gold:active{box-shadow:0 .08em 0 #c4720a,0 .08em 0 3px var(--ol)}
.btn.green{background:linear-gradient(#8cf07f,#34b24e);box-shadow:0 .28em 0 #1f7a35,0 .28em 0 3px var(--ol),inset 0 2px 0 rgba(255,255,255,.45)}
.btn.green:active{box-shadow:0 .08em 0 #1f7a35,0 .08em 0 3px var(--ol)}
.btn.ghost{background:linear-gradient(#65549c,#473874);box-shadow:0 .28em 0 #251a45,0 .28em 0 3px var(--ol),inset 0 2px 0 rgba(255,255,255,.2)}
.btn.ghost:active{box-shadow:0 .08em 0 #251a45,0 .08em 0 3px var(--ol)}
.btn.sm{font-size:.9em;padding:.5em .9em}
.btn[disabled]{filter:grayscale(.85) brightness(.7);cursor:default;pointer-events:none}
.btn img{width:1.25em;height:1.25em;margin:-.2em 0}
.ad{font-size:.62em;background:var(--ol);color:#fff;border-radius:.5em;padding:.25em .5em;letter-spacing:.04em;text-shadow:none}
.rb{pointer-events:auto;width:2.6em;height:2.6em;flex:none;border-radius:.8em;border:3px solid var(--ol);background:linear-gradient(#6a58a8,#45357a);box-shadow:0 .2em 0 #251a45,inset 0 2px 0 rgba(255,255,255,.22);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:1em;padding:0}
.rb:active{transform:translateY(.12em);box-shadow:0 .06em 0 #251a45}
.rb.off{filter:grayscale(1) brightness(.6)}
.pz{display:block;width:.9em;height:1em;border-left:.32em solid #fff;border-right:.32em solid #fff;box-sizing:border-box}
.pill{display:inline-flex;align-items:center;gap:.3em;background:rgba(23,15,51,.78);border:2.5px solid var(--ol);border-radius:1.3em;padding:.12em .8em .12em .15em;font-family:var(--fd);font-size:1.1em;font-variant-numeric:tabular-nums}
.pill img{width:1.75em;height:1.75em}

/* screens */
.scr{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:var(--gt);padding-bottom:var(--gb)}
.scr.dim{background:rgba(23,15,51,.74);justify-content:center;gap:.9em}
.scr h1{margin:0;font-family:var(--fd);font-size:2.5em;line-height:1;text-align:center;color:var(--gold);letter-spacing:.01em}
.scr h1.red{color:var(--red)} .scr h1.grn{color:var(--green)}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes cardin{0%{transform:translateY(1.6em) scale(.9);opacity:0}100%{transform:none;opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes bobl{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-.35em) rotate(-2deg)}}
@keyframes shake{0%,100%{transform:rotate(0) scale(1)}15%{transform:rotate(-9deg) scale(1.05)}30%{transform:rotate(8deg) scale(1.08)}45%{transform:rotate(-7deg) scale(1.1)}60%{transform:rotate(6deg) scale(1.14)}80%{transform:rotate(0) scale(1.32)}}
@keyframes rays{to{transform:rotate(360deg)}}
.scr.dim h1{animation:pop .35s cubic-bezier(.2,1.5,.4,1) backwards}

/* loading */
#load{position:absolute;inset:0;z-index:50;background:radial-gradient(circle at 50% 40%,#3b2a78,#1b1230 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2em}
#load b{font-family:var(--fd);font-size:2.2em;color:#fff;text-align:center;line-height:1}
#load b span{display:block;color:var(--gold);font-size:.62em;margin-top:.2em}
.lbar{width:11em;height:.8em;border:3px solid var(--ol);border-radius:.6em;background:var(--deep);overflow:hidden}
.lbar i{display:block;height:100%;width:35%;border-radius:.4em;background:linear-gradient(#ffe778,#ffab1c);animation:ld 1s ease-in-out infinite alternate}
@keyframes ld{from{margin-left:0}to{margin-left:65%}}

/* HUD */
#hud{position:absolute;inset:0;z-index:10;pointer-events:none;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
#xpbar{position:relative;height:1.15em;margin-top:.45em;margin-left:max(16px,env(safe-area-inset-left,0px));margin-right:max(16px,env(safe-area-inset-right,0px));background:rgba(23,15,51,.8);border:2.5px solid var(--ol);border-radius:.7em;overflow:hidden}
#xpfill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#a6f0ff,#3fa7ff);border-radius:.5em;transition:width .14s;box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
#lvl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--fd);font-size:.74em;letter-spacing:.04em;text-shadow:0 1px 0 var(--ol),0 -1px 0 var(--ol),1px 0 0 var(--ol),-1px 0 0 var(--ol)}
#hudrow{display:flex;align-items:center;justify-content:space-between;gap:.5em;margin-top:.35em;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#hstats{display:flex;gap:.35em;flex:1;min-width:0}
.st{display:inline-flex;align-items:center;gap:.2em;background:rgba(23,15,51,.7);border-radius:1em;padding:.08em .6em .08em .1em;font-family:var(--fd);font-size:.95em;font-variant-numeric:tabular-nums}
.st img{width:1.55em;height:1.55em}
#timer{font-family:var(--fd);font-size:1.75em;line-height:1;font-variant-numeric:tabular-nums;flex:none}
#hudr{flex:1;display:flex;justify-content:flex-end;min-width:0}
#slots{position:absolute;left:max(16px,env(safe-area-inset-left,0px));margin-top:.45em;display:flex;flex-direction:column;gap:.3em}
#slots>div{display:flex;gap:.22em;min-height:1.9em}
.sl{position:relative;width:1.9em;height:1.9em}
.sl img{width:100%;height:100%;display:block}
.sl b{position:absolute;right:-.25em;bottom:-.3em;min-width:1.1em;text-align:center;font-family:var(--fd);font-size:.6em;line-height:1.5;background:var(--ol);border-radius:.7em;padding:0 .25em}
.sl.evo b{background:var(--gold2);color:#3a2205}
#bossbar{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 4.7em);width:min(46%,24em);text-align:center}
#bossbar b{font-family:var(--fd);font-size:1em;color:var(--red);letter-spacing:.05em}
.bb{height:.95em;margin-top:.15em;border:2.5px solid var(--ol);border-radius:.6em;background:rgba(23,15,51,.85);overflow:hidden}
.bb i{display:block;height:100%;width:100%;background:linear-gradient(#ff8a96,#e0304a);box-shadow:inset 0 2px 0 rgba(255,255,255,.4);transition:width .12s}
@media (orientation:portrait){#bossbar{top:calc(env(safe-area-inset-top,0px) + 10.4em);width:72%}}
#banner{position:absolute;left:0;right:0;top:25%;text-align:center;font-family:var(--fd);font-size:2em;color:#ffe066;opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s cubic-bezier(.2,1.6,.4,1)}
#banner.on{opacity:1;transform:scale(1)}
#banner.boss{color:var(--red);font-size:2.6em}
#hint{position:absolute;left:50%;bottom:calc(14% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:86%;text-align:center;background:rgba(23,15,51,.8);border:2.5px solid var(--ol);border-radius:1em;padding:.45em 1em;font-size:1.02em;line-height:1.3;transition:opacity .3s}
#hint:empty{opacity:0;border-color:transparent;background:none}
#joy{position:absolute;z-index:11;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;background:rgba(255,255,255,.13);border:3px solid rgba(255,255,255,.4);pointer-events:none}
#joyk{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.75);border:3px solid var(--ol)}
#toast{position:absolute;z-index:60;left:50%;top:calc(env(safe-area-inset-top,0px) + 4.3em);transform:translate(-50%,-1em);background:var(--ol);border:2.5px solid #5a4a8a;border-radius:1em;padding:.5em 1.1em;font-size:.95em;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:86%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* menu */
#s-menu{justify-content:space-between;gap:.45em}
.mtop{width:100%;display:flex;justify-content:space-between;align-items:center;gap:.5em}
.mtop>div{display:flex;gap:.4em}
.logoimg{display:block;width:min(88%,31em);max-height:22vh;object-fit:contain;animation:bobl 3.4s ease-in-out infinite;pointer-events:none}

.stage{display:flex;align-items:center;gap:.5em}
.stage .nm{width:12.5em;max-width:56vw;text-align:center;background:rgba(23,15,51,.78);border:2.5px solid var(--ol);border-radius:.9em;padding:.3em .6em;box-sizing:border-box}
.nm b{display:block;font-family:var(--fd);font-size:1.02em}
.nm small{color:var(--mute);font-size:.76em}
.play{font-size:1.9em;padding:.42em 1.8em;animation:pulse 1.5s ease-in-out infinite}
.mnav{display:flex;gap:.55em;flex-wrap:wrap;justify-content:center}
.nb{position:relative;display:flex;flex-direction:column;align-items:center;gap:.1em;width:5.3em;padding:.4em .2em .35em;border:3px solid var(--ol);border-radius:1em;background:linear-gradient(#65549c,#473874);box-shadow:0 .25em 0 #251a45,inset 0 2px 0 rgba(255,255,255,.2);font-family:var(--fd);font-size:.84em;cursor:pointer;letter-spacing:.02em}
.nb:active{transform:translateY(.14em);box-shadow:0 .08em 0 #251a45}
.nb img{width:2.5em;height:2.5em}
.dot{position:absolute;top:-.4em;right:-.4em;width:1.15em;height:1.15em;border-radius:50%;background:var(--red);border:2.5px solid var(--ol);animation:pulse 1s infinite}
.mcol{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:.45em}
@media (orientation:portrait){.logoimg{max-height:27vh}}
.side .mcol{width:54%;align-self:flex-end;justify-content:center;gap:.55em}
.side .mmid{display:none}
.side .logoimg{max-height:36vh;width:auto;max-width:100%}
.side .play{font-size:1.5em}
.side .herotag span{display:none}
.side .mtop{position:absolute;left:0;right:0;top:var(--gt);box-sizing:border-box;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.side .mtop>*{pointer-events:auto}

/* sheets */
.sheet{width:min(100%,46em);max-height:100%;display:flex;flex-direction:column;background:linear-gradient(var(--panel),var(--panel2));border:3px solid var(--ol);border-radius:1.3em;box-shadow:0 .5em 0 var(--deep),inset 0 2px 0 rgba(255,255,255,.18);overflow:hidden;animation:cardin .25s ease-out}
.sheet header{display:flex;align-items:center;gap:.6em;padding:.6em .8em;background:rgba(23,15,51,.4);border-bottom:3px solid var(--ol)}
.sheet h2{margin:0;font-family:var(--fd);font-size:1.5em;flex:1;min-width:0}
.sbody{overflow-y:auto;padding:.8em;display:grid;gap:.6em;grid-template-columns:repeat(auto-fill,minmax(14.5em,1fr));touch-action:pan-y;align-content:start}
.sbody.one{grid-template-columns:1fr}
.sbody.hg{grid-template-columns:repeat(auto-fill,minmax(9.6em,1fr))}
.it{position:relative;display:flex;align-items:center;gap:.6em;text-align:left;background:rgba(23,15,51,.42);border:2.5px solid var(--ol);border-radius:1em;padding:.5em .6em;min-width:0;cursor:pointer;font-size:1em}
.it:active{transform:translateY(2px)}
.it>img{width:3em;height:3em;flex:none}
.it .tx{flex:1;min-width:0;display:block}
.it b{display:block;font-family:var(--fd);font-size:1em}
.it small{display:block;font-size:.8em;color:var(--mute);line-height:1.25}
.pips{display:flex;gap:.2em;margin-top:.25em}
.pips i{width:.85em;height:.42em;border-radius:.3em;background:rgba(255,255,255,.18);border:1.5px solid var(--ol)}
.pips i.on{background:var(--gold)}
.price{flex:none;display:inline-flex;align-items:center;gap:.15em;font-family:var(--fd);font-size:.95em;background:linear-gradient(#ffe778,#ffab1c);color:#4a2a05;border:2.5px solid var(--ol);border-radius:.8em;padding:.2em .55em .2em .2em}
.price img{width:1.35em;height:1.35em}
.price.no{background:#5a4f78;color:#b9afd6}
.price.max{background:var(--green2);color:#fff;padding:.2em .6em}
.hc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.25em;background:rgba(23,15,51,.42);border:2.5px solid var(--ol);border-radius:1.1em;padding:.6em .6em .8em}
.hc.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.hc img.hp{width:6.5em;height:7em;object-fit:contain}
.hc.lock img.hp{filter:brightness(.45) saturate(.5)}
.hc b{font-family:var(--fd);font-size:1.2em}
.hc small{color:var(--mute);font-size:.8em;line-height:1.3}
.hc .wp{display:flex;align-items:center;gap:.3em;font-size:.82em;color:#fff3c4}
.hc .wp img{width:1.7em;height:1.7em}
.qrow{display:flex;align-items:center;gap:.6em;background:rgba(23,15,51,.42);border:2.5px solid var(--ol);border-radius:1em;padding:.55em .7em}
.qrow .tx{flex:1;min-width:0}
.qrow b{font-family:var(--fd);font-size:.98em;display:block}
.qbar{height:.6em;margin-top:.3em;border-radius:.4em;background:rgba(255,255,255,.14);border:1.5px solid var(--ol);overflow:hidden}
.qbar i{display:block;height:100%;background:linear-gradient(#a6f0ff,#3fa7ff)}
.qrow small{color:var(--mute);font-size:.78em}
.sect{grid-column:1/-1;font-family:var(--fd);font-size:1.05em;color:var(--gold);margin-top:.2em}
.cx{display:flex;align-items:center;gap:.35em;background:rgba(23,15,51,.42);border:2.5px solid var(--ol);border-radius:1em;padding:.45em .55em;min-width:0}
.cx img{width:2.5em;height:2.5em;flex:none}
.cx .op{font-family:var(--fd);font-size:1.1em;color:var(--mute)}
.cx .tx{flex:1;min-width:0;margin-left:.2em}
.cx b{display:block;font-family:var(--fd);font-size:.9em}
.cx small{display:block;color:var(--mute);font-size:.74em;line-height:1.2}
.cx.un img.ev{filter:brightness(0) invert(.25)}

/* level up */
#cards{display:flex;gap:.8em;justify-content:center;align-items:stretch;width:100%;max-width:47em}
.card{position:relative;flex:1 1 0;min-width:0;max-width:15em;background:linear-gradient(#5868d8,#343c9c);border:3px solid var(--ol);border-radius:1.15em;box-shadow:0 .38em 0 #1b1f5c,0 .38em 0 3px var(--ol),inset 0 2px 0 rgba(255,255,255,.28);padding:1.15em .7em .9em;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.4em;animation:cardin .32s cubic-bezier(.2,1.3,.4,1) backwards;transition:transform .1s,filter .1s;font-size:1em}
.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}
.card:hover{transform:translateY(-.25em);filter:brightness(1.12)}
.card:active{transform:translateY(.15em)}
.card.p{background:linear-gradient(#3fae78,#1c6e4c);box-shadow:0 .38em 0 #0f4530,0 .38em 0 3px var(--ol),inset 0 2px 0 rgba(255,255,255,.28)}
.card.m,.card.e{background:linear-gradient(#f2b63a,#c46d12);box-shadow:0 .38em 0 #7a3f06,0 .38em 0 3px var(--ol),inset 0 2px 0 rgba(255,255,255,.4)}
.card .ci{width:4.6em;height:4.6em;flex:none}
.card .txt{display:block;min-width:0}
.card .nm2{display:block;font-family:var(--fd);font-size:1.15em;line-height:1.1}
.card .ds{display:block;font-size:.88em;line-height:1.25;color:#f0ebff;margin-top:.3em}
.card .tag{position:absolute;top:-.75em;right:-.4em;font-family:var(--fd);font-size:.74em;padding:.22em .65em;border-radius:.8em;border:2.5px solid var(--ol);background:#2a3fa8}
.card .tag.new{background:var(--red2)}
.card .key{position:absolute;top:.35em;left:.6em;font-family:var(--fd);font-size:.72em;opacity:.6}
.card .hn{display:flex;align-items:center;justify-content:center;gap:.3em;font-size:.76em;color:#ffeeb0;margin-top:.35em}
.card .hn img{width:1.6em;height:1.6em}
.card .hn.hot{color:#fff;background:rgba(23,15,51,.45);border-radius:.8em;padding:.1em .5em .1em .2em}
@media (orientation:portrait){
  #cards{flex-direction:column;max-width:26em}
  .card{flex:none;max-width:none;flex-direction:row;text-align:left;padding:.7em .8em .7em .7em;gap:.75em}
  .card .ci{width:3.9em;height:3.9em}
  .card .txt{flex:1}
  .card .hn{justify-content:flex-start}
  .card .key{display:none}
}
@media (pointer:coarse){.card .key{display:none}}

/* chest */
.chbox{position:relative;width:9em;height:9em;display:flex;align-items:center;justify-content:center}
.chbox::before{content:"";position:absolute;inset:-35%;background:conic-gradient(from 0deg,rgba(255,224,102,0) 0 8%,rgba(255,224,102,.5) 8% 12%,rgba(255,224,102,0) 12% 20%,rgba(255,224,102,.5) 20% 24%,rgba(255,224,102,0) 24% 33%,rgba(255,224,102,.5) 33% 37%,rgba(255,224,102,0) 37% 46%,rgba(255,224,102,.5) 46% 50%,rgba(255,224,102,0) 50% 58%,rgba(255,224,102,.5) 58% 62%,rgba(255,224,102,0) 62% 71%,rgba(255,224,102,.5) 71% 75%,rgba(255,224,102,0) 75% 83%,rgba(255,224,102,.5) 83% 87%,rgba(255,224,102,0) 87%);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 25%,transparent 68%);animation:rays 9s linear infinite}
.chbox img{position:relative;width:100%;height:100%;animation:shake .8s ease-in-out backwards}
#ch-items{display:flex;flex-wrap:wrap;gap:.5em;justify-content:center;max-width:40em}
.chi{display:flex;align-items:center;gap:.5em;background:linear-gradient(var(--panel),var(--panel2));border:2.5px solid var(--ol);border-radius:1em;padding:.4em .8em .4em .45em;animation:pop .35s cubic-bezier(.2,1.5,.4,1) backwards;box-shadow:0 .25em 0 var(--deep)}
.chi.e{background:linear-gradient(#f2b63a,#c46d12);font-size:1.15em}
.chi img{width:2.8em;height:2.8em}
.chi b{display:block;font-family:var(--fd);font-size:1em;line-height:1.1}
.chi small{font-size:.78em;color:#f0ebff}
#ch-coins{animation:pop .35s backwards}

/* results */
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em;width:min(100%,26em)}
.rs{background:rgba(23,15,51,.6);border:2.5px solid var(--ol);border-radius:1em;padding:.5em .3em;text-align:center}
.rs img{width:2em;height:2em;display:block;margin:0 auto}
.rs b{display:block;font-family:var(--fd);font-size:1.3em;font-variant-numeric:tabular-nums}
.rs small{color:var(--mute);font-size:.74em}
.rcoin{display:flex;align-items:center;gap:.3em;font-family:var(--fd);font-size:2.3em;color:var(--gold);font-variant-numeric:tabular-nums}
.rcoin img{width:1.3em;height:1.3em}
.rnote{font-size:.92em;text-align:center;color:#fff3c4;min-height:1.2em;max-width:30em;line-height:1.3}
.rbtn{display:flex;gap:.7em;flex-wrap:wrap;justify-content:center}
.cd{width:min(70%,16em);height:.7em;border:2.5px solid var(--ol);border-radius:.5em;background:var(--deep);overflow:hidden}

.col{display:flex;flex-direction:column;gap:.75em;align-items:center}

<script>

'use strict';
/* ============ Spellstorm Survivors : core ============ */
const GAME_TITLE = 'Blademaster Arena';
const TAU = Math.PI * 2;
const rnd = Math.random;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + rnd() * (b - a);
const randi = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const hyp = Math.hypot;
const $ = id => document.getElementById(id);
function hash2(x, y) { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function fmtTime(s) { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function fmtNum(n) { n = Math.floor(n); return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'K' : String(n); }
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function dayNum() { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 864e5); }

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r || 0, w / 2, h / 2);
    this.moveTo(x + r, y); this.lineTo(x + w - r, y); this.quadraticCurveTo(x + w, y, x + w, y + r);
    this.lineTo(x + w, y + h - r); this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    this.lineTo(x + r, y + h); this.quadraticCurveTo(x, y + h, x, y + h - r);
    this.lineTo(x, y + r); this.quadraticCurveTo(x, y, x + r, y); this.closePath();
  };
}

/* ---------- CrazyGames SDK wrapper (safe when SDK is missing) ---------- */
const SDK = {
  ok: false, api: null, playing: false, adOpen: false,
  async init() {
    try {
      const s = window.CrazyGames && window.CrazyGames.SDK;
      if (s) { await s.init(); if (s.environment !== 'disabled') { this.api = s; this.ok = true; } }
    } catch (e) { this.ok = false; }
  },
  call(mod, fn, a) { try { if (this.ok && this.api[mod] && this.api[mod][fn]) return this.api[mod][fn](a); } catch (e) { } },
  loadStart() { this.call('game', 'loadingStart'); },
  loadStop() { this.call('game', 'loadingStop'); },
  start() { if (!this.playing) { this.playing = true; this.call('game', 'gameplayStart'); } },
  stop() { if (this.playing) { this.playing = false; this.call('game', 'gameplayStop'); } },
  happy() { this.call('game', 'happytime'); },
  muted() { try { return !!(this.ok && this.api.game.settings && this.api.game.settings.muteAudio); } catch (e) { return false; } },
  /* type: 'midgame' | 'rewarded'. done(ok): ok=true means the reward may be granted / play may continue */
  ad(type, done) {
    if (!this.ok) { done(true); return; }
    let fin = false, started = false;
    const end = ok => { if (fin) return; fin = true; clearTimeout(wd); this.adOpen = false; Snd.duck(false); done(ok); };
    const wd = setTimeout(() => { if (!started) end(type !== 'rewarded'); }, 8000);
    try {
      this.adOpen = true;
      this.api.ad.requestAd(type, {
        adStarted: () => { started = true; Snd.duck(true); },
        adFinished: () => end(true),
        adError: () => end(type !== 'rewarded')
      });
    } catch (e) { end(type !== 'rewarded'); }
  }
};

/* ---------- persistent save ---------- */
const SAVE_KEY = 'blademaster_save_v1';
const Store = {
  /* CrazyGames SDK v3 Data Module first (after SDK init); localStorage fallback when the SDK is missing or disabled (e.g. GitHub Pages). */
  dm() { try { return SDK.ok && SDK.api && SDK.api.data && typeof SDK.api.data.getItem === 'function' ? SDK.api.data : null; } catch (e) { return null; } },
  lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } },
  get(k) {
    const d = this.dm();
    if (d) {
      let v = null; try { v = d.getItem(k); } catch (e) { v = null; }
      if (v != null) return v;
      const old = this.lsGet(k); /* one-time migration of an existing local save into the Data Module */
      if (old != null) { try { d.setItem(k, old); } catch (e) { } }
      return old;
    }
    return this.lsGet(k);
  },
  set(k, v) {
    const d = this.dm();
    if (d) { try { d.setItem(k, v); } catch (e) { } }
    this.lsSet(k, v);
  }
};
function defaultSave() {
  return {
    v: 1, coins: 0, upg: {}, heroes: { glad: 1 }, hero: 'glad', stage: 0, unlocked: 1, best: {},
    stats: { runs: 0, kills: 0, time: 0, bosses: 0 }, codex: {}, seen: {},
    daily: { day: '', dn: 0, streak: 0, claimed: false, q: [] }, set: { sfx: 1, mus: 1 }, tut: 0
  };
}
let SV = defaultSave();
function loadSave() {
  try {
    const s = Store.get(SAVE_KEY);
    if (s) {
      const o = JSON.parse(s), d = defaultSave();
      SV = Object.assign(d, o);
      SV.set = Object.assign({ sfx: 1, mus: 1 }, o.set || {});
      SV.stats = Object.assign({ runs: 0, kills: 0, time: 0, bosses: 0 }, o.stats || {});
      SV.daily = Object.assign({ day: '', dn: 0, streak: 0, claimed: false, q: [] }, o.daily || {});
      if (!SV.heroes || !SV.heroes.glad) SV.heroes = Object.assign({ glad: 1 }, SV.heroes || {}); if (!HEROES[SV.hero]) SV.hero = 'glad';
    }
  } catch (e) { SV = defaultSave(); }
}
let saveT = 0;
function saveNow() { clearTimeout(saveT); saveT = 0; try { Store.set(SAVE_KEY, JSON.stringify(SV)); } catch (e) { } }
function save() { if (!saveT) saveT = setTimeout(saveNow, 250); }

/* ---------- audio: everything is synthesized, no files ---------- */
const Snd = {
  ctx: null, master: null, sfx: null, mus: null, nb: null, last: {}, combo: 0, comboT: 0,
  init() {
    if (this.ctx) return;
    try {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      const c = this.ctx = new C();
      this.master = c.createGain(); this.master.connect(c.destination);
      const comp = c.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 6; comp.connect(this.master);
      this.sfx = c.createGain(); this.sfx.connect(comp);
      this.mus = c.createGain(); this.mus.connect(comp);
      const n = c.sampleRate, b = c.createBuffer(1, n, n), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      this.nb = b; this.vol();
    } catch (e) { this.ctx = null; }
  },
  unlock() { this.init(); if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  vol() { if (!this.ctx) return; const m = SDK.muted(); this.sfx.gain.value = SV.set.sfx && !m ? 0.55 : 0; this.mus.gain.value = SV.set.mus && !m ? 0.30 : 0; },
  duck(on) { if (this.ctx) this.master.gain.setTargetAtTime(on ? 0 : 1, this.ctx.currentTime, 0.04); },
  tone(f, d, o) {
    const c = this.ctx; if (!c) return; o = o || {};
    const t = c.currentTime + (o.at || 0), os = c.createOscillator(), g = c.createGain();
    os.type = o.type || 'sine'; os.frequency.setValueAtTime(f, t);
    if (o.to) os.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t + d);
    const v = o.vol == null ? 0.2 : o.vol;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + (o.a || 0.006)); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    os.connect(g); g.connect(o.dest || this.sfx); os.start(t); os.stop(t + d + 0.03);
  },
  noise(d, o) {
    const c = this.ctx; if (!c) return; o = o || {};
    const t = c.currentTime + (o.at || 0), s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.nb; s.loop = true; f.type = o.ft || 'lowpass'; f.frequency.setValueAtTime(o.f || 2000, t);
    if (o.fto) f.frequency.exponentialRampToValueAtTime(o.fto, t + d);
    f.Q.value = o.q || 0.8;
    const v = o.vol == null ? 0.2 : o.vol;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + (o.a || 0.004)); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(o.dest || this.sfx); s.start(t, rnd() * 0.5); s.stop(t + d + 0.03);
  },
  play(n) {
    const c = this.ctx; if (!c || c.state !== 'running') return;
    const now = c.currentTime, lim = SND_LIMIT[n] || 0;
    if (lim && now - (this.last[n] || -9) < lim) return; this.last[n] = now;
    const T = (f, d, o) => this.tone(f, d, o), N = (d, o) => this.noise(d, o);
    switch (n) {
      case 'shoot': T(760, 0.07, { type: 'triangle', to: 380, vol: 0.05 }); break;
      case 'hit': N(0.045, { ft: 'bandpass', f: 1700, vol: 0.07 }); break;
      case 'kill': T(300, 0.1, { type: 'triangle', to: 90, vol: 0.09 }); N(0.06, { f: 900, vol: 0.05 }); break;
      case 'gem': {
        if (now - this.comboT > 0.45) this.combo = 0; this.comboT = now; this.combo = Math.min(14, this.combo + 1);
        T(620 * Math.pow(1.0595, this.combo * 2), 0.09, { vol: 0.07 }); break;
      }
      case 'coin': T(1319, 0.06, { type: 'square', vol: 0.035 }); T(1760, 0.12, { type: 'square', vol: 0.035, at: 0.06 }); break;
      case 'hurt': T(190, 0.22, { type: 'sawtooth', to: 60, vol: 0.16 }); N(0.12, { f: 700, vol: 0.12 }); break;
      case 'lvl': [523, 659, 784, 1047].forEach((f, i) => T(f, 0.2, { type: 'triangle', vol: 0.13, at: i * 0.075 })); T(1568, 0.4, { vol: 0.07, at: 0.3 }); break;
      case 'pick': T(660, 0.12, { type: 'triangle', to: 1100, vol: 0.12 }); break;
      case 'chest': N(0.4, { ft: 'bandpass', f: 400, fto: 3000, vol: 0.1 }); [392, 494, 587, 784, 988, 1175].forEach((f, i) => T(f, 0.22, { type: 'triangle', vol: 0.11, at: 0.25 + i * 0.07 })); break;
